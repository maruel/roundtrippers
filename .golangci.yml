# golangci-lint configuration.

version: "2"
run:
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - appendAssign
        - exitAfterDefer
        - unnamedResult
    gosec:
      excludes:
        - G101
        - G107
        - G110
        - G115
        - G204
        - G301
        - G302
        - G304
        - G306
        - G703
        - G704
        - G705
        - G706
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      # Standalone examples intentionally demonstrate the HTTP convenience API
      # and repeat complete, copyable compression examples.
      - path: ^example_test\.go$
        linters: [dupl, noctx]
      # Retry classifies direct net/http errors, not arbitrary error chains.
      - path: ^retry\.go$
        linters: [errorlint]
        text: type assertion on error will fail on wrapped errors
      - path: (.+)\.go$
        text: should have a package comment
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      # Simplify the code the way gofmt -s does.
      simplify: true
