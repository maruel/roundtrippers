# golangci-lint configuration.

version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - gosec
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - appendAssign
        - exitAfterDefer
        - unnamedResult
    gosec:
      excludes:
        - G101
        - G107
        - G110
        - G115
        - G204
        - G301
        - G302
        - G304
        - G306
        - G703
        - G704
        - G705
        - G706
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      # Retry classifies direct net/http errors, not arbitrary error chains.
      - path: ^retry\.go$
        linters: [errorlint]
        text: type assertion on error will fail on wrapped errors
      - path: (.+)\.go$
        text: should have a package comment
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      # Simplify the code the way gofmt -s does.
      simplify: true
